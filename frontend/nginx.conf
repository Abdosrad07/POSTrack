# POSTrack Frontend - configuration Nginx (conteneur "web")
#
# Deux roles :
#   1. servir le bundle Vite en mode SPA (fallback vers index.html) ;
#   2. proxifier "/api" vers le conteneur backend ("api" dans le reseau
#      docker-compose) : meme origine pour le navigateur -> aucun probleme
#      de CORS ni d'ambiguite IPv4/IPv6.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API : le prefixe /api est conserve tel quel cote backend
    # (les routes FastAPI sont montees sous /api/...).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA : toute route inconnue renvoie index.html (routing React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques caches longtemps (noms hashes par Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
